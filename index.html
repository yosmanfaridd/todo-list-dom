<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f1ec" />
    <meta name="description" content="Organiza tus tareas pendientes y fechas importantes." />
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <header class="app-header">
        <div>
          <p class="eyebrow">Mi agenda</p>
          <h1>Mis tareas</h1>
        </div>
        <button class="theme-button" id="theme-button" type="button" aria-label="Cambiar a tema oscuro" title="Cambiar tema">
          <span aria-hidden="true" id="theme-icon">☾</span>
        </button>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-title">Nueva tarea</label>
        <input
          id="todo-title"
          type="text"
          placeholder="¿Qué necesitas hacer?"
          autocomplete="off"
          maxlength="100"
          required
        />

        <label class="sr-only" for="date-picker">Fecha</label>
        <input id="date-picker" type="date" aria-label="Fecha de la tarea" />

        <button class="add-button" type="submit">
          <span aria-hidden="true">＋</span>
          <span>Añadir</span>
        </button>
      </form>

      <section class="tasks-section" aria-labelledby="tasks-heading">
        <div class="section-heading">
          <h2 id="tasks-heading">Hoy</h2>
          <span id="task-count" aria-live="polite"></span>
        </div>

        <div class="task-list" id="todo-list"></div>
        <p class="empty-state" id="empty-state">No tienes tareas pendientes.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
